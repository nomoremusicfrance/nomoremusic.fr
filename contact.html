<style>
:root{
  --ground:#070c0b;
  --surface:#0b1211;
  --raised:#101917;
  --bone:#ede6da;
  --mute:#8d948f;
  --amber:#c9995c;
  --amber-soft:#e0b784;
  --hair:rgba(237,230,218,.13);
  --hair-strong:rgba(237,230,218,.24);
  --display:"Outfit",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --brand:"Archivo","Outfit",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --sans:"Outfit",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --gut:clamp(20px,5vw,72px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{overflow-anchor:none}
html,body{min-height:100%}
body{margin:0;background:var(--ground);color:var(--bone);
  font-family:var(--sans);font-weight:300;font-size:15px;line-height:1.7;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  display:flex;flex-direction:column}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
:focus-visible{outline:1px solid var(--amber);outline-offset:3px}
.label{font-size:10px;font-weight:400;letter-spacing:.32em;text-transform:uppercase;color:var(--mute);margin:0}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:22px var(--gut);padding-top:calc(22px + env(safe-area-inset-top,0px));min-height:calc(22px + 33px + 22px + env(safe-area-inset-top,0px));
  border-bottom:1px solid var(--hair);background:rgba(7,12,11,.82);backdrop-filter:blur(14px)}
.mark{display:flex;align-items:center;min-height:33px}
.mark img{width:clamp(112px,13vw,158px);height:auto;opacity:.97}
.hdr-r{display:flex;align-items:center;gap:22px}
.lang{-webkit-appearance:none;appearance:none;background:none;border:0;margin:0;padding:4px 0;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:10.5px;font-weight:400;letter-spacing:.26em;
  text-transform:uppercase;color:var(--bone)}
.lang [data-l]{opacity:.5;transition:opacity .35s ease,color .35s ease}
.lang [data-l][data-on="true"]{opacity:1;color:var(--amber-soft)}
.lang i{width:1px;height:10px;background:currentColor;opacity:.35}
.lang:hover [data-l]{opacity:.85}
.back{display:inline-flex;align-items:center;gap:12px;font-size:10.5px;letter-spacing:.26em;
  text-transform:uppercase;color:var(--mute);padding:4px 0;transition:color .4s ease}
.back::before{content:"";flex:0 0 6px;width:6px;height:10px;background:currentColor;
  -webkit-mask:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCA2IDEwJz48cGF0aCBkPSdNNSAxTDEgNWw0IDQnIGZpbGw9J25vbmUnIHN0cm9rZT0nIzAwMCcgc3Ryb2tlLXdpZHRoPScxLjEnIHN0cm9rZS1saW5lY2FwPSdyb3VuZCcgc3Ryb2tlLWxpbmVqb2luPSdyb3VuZCcvPjwvc3ZnPg==") center/contain no-repeat;mask:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCA2IDEwJz48cGF0aCBkPSdNNSAxTDEgNWw0IDQnIGZpbGw9J25vbmUnIHN0cm9rZT0nIzAwMCcgc3Ryb2tlLXdpZHRoPScxLjEnIHN0cm9rZS1saW5lY2FwPSdyb3VuZCcgc3Ryb2tlLWxpbmVqb2luPSdyb3VuZCcvPjwvc3ZnPg==") center/contain no-repeat;
  transition:transform .5s cubic-bezier(.2,.7,.3,1)}
.back:hover{color:var(--amber-soft)}
.back:hover::before{transform:translateX(-4px)}

/* ---------- split ---------- */
main{flex:1 0 auto}
body{min-height:100vh;min-height:100svh}
.split{display:grid;grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr);align-items:stretch}

/* colonne gauche : visuel + discours */
.aside{--apad:clamp(26px,3.4vw,56px);
  position:relative;isolation:isolate;overflow:hidden;background:var(--raised);
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:clamp(40px,5vw,72px) var(--apad) clamp(34px,4vw,58px);
  min-height:clamp(420px,62vh,760px)}
.aside img{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;object-position:52% 32%}
/* visage recentré : la photo glisse un peu vers la droite, même taille ; le bord gauche se fond dans le fond */
.aside img{translate:5.5% 0;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 14%);mask-image:linear-gradient(to right,transparent 0,#000 14%)}
.aside::after{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(to top,rgba(4,8,8,.94) 8%,rgba(4,8,8,.62) 46%,rgba(4,8,8,.26) 100%),
             linear-gradient(to right,rgba(4,8,8,.55),rgba(4,8,8,0) 70%)}
.aside h1 .ln{display:block}
.aside h1{font-family:var(--brand);font-stretch:125%;font-weight:300;
  font-size:clamp(26px,3vw,42px);line-height:1.2;letter-spacing:-.015em;
  margin:14px 0 0;text-wrap:balance}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:30px 0 0;padding:0;list-style:none}
.pills li{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:rgba(237,230,218,.62);
  border:1px solid var(--hair-strong);border-radius:999px;padding:7px 14px}
.aside .direct{margin:30px 0 0;padding-top:24px;border-top:1px solid var(--hair);display:grid;gap:12px;justify-items:start}
/* coordonnées : même échelle typographique pour le mail et le délai de réponse, sans soulignement */
.aside .direct{gap:0}
.aside .direct .mailto{margin-bottom:13px}
.aside .direct .delay{position:relative;padding-top:14px}
.aside .direct .delay::before{content:"";position:absolute;left:0;top:0;width:64px;height:1px;
  background:linear-gradient(90deg,var(--amber-soft),rgba(201,153,92,.35))}
.mailto{display:inline-block;font-size:10.5px;font-weight:400;letter-spacing:.26em;text-transform:uppercase;
  color:rgba(237,230,218,.88);transition:color .4s ease}
.mailto:hover,.mailto:focus-visible{color:var(--amber-soft);outline:0}
.delay{margin:0;text-wrap:balance;font-size:10px;font-weight:300;letter-spacing:.22em;line-height:1.8;text-transform:uppercase;
  color:rgba(141,148,143,.85)}

/* colonne droite : formulaire */
.panel{background:var(--surface);padding:clamp(40px,5vw,84px) var(--gut) clamp(40px,5vw,72px);
  display:flex;align-items:center}
.panel-in{width:100%;max-width:620px;margin:0 auto}
/* après envoi : le remerciement reste en haut de la colonne, là où commençait le formulaire (il ne « descend » plus) */
.panel.is-done{align-items:flex-start}
@media (min-width:981px){ .panel.is-done .done{padding-top:0} }

.form{margin:26px 0 0;display:grid;gap:clamp(20px,2.2vw,28px)}
.row{display:grid;gap:clamp(20px,2.2vw,28px);grid-template-columns:1fr 1fr}
.field{display:grid;gap:8px;min-width:0;align-content:start}
.field label{font-size:10px;font-weight:400;letter-spacing:.32em;text-transform:uppercase;color:var(--mute);
  transition:color .35s ease}
.field input,.field textarea{
  appearance:none;-webkit-appearance:none;background:transparent;border:0;
  border-bottom:1px solid rgba(237,230,218,.2);border-radius:0;
  color:var(--bone);font-family:var(--sans);font-size:14.5px;font-weight:300;
  padding:10px 0;transition:border-color .4s ease}
.field textarea{resize:vertical;min-height:112px;line-height:1.75}
@media (max-width:900px), (hover:none){ .field input,.field textarea{font-size:16px} }
.field input:focus,.field textarea:focus{outline:none;border-bottom-color:var(--amber-soft)}
.field:focus-within label{color:var(--amber-soft)}
.field input:-webkit-autofill,.field input:-webkit-autofill:hover,.field input:-webkit-autofill:focus,.field input:-webkit-autofill:active,
.field textarea:-webkit-autofill,.field textarea:-webkit-autofill:hover,.field textarea:-webkit-autofill:focus,.field textarea:-webkit-autofill:active{
  /* remplissage automatique (iPhone, Safari, Chrome) : plus de cadre bleu/blanc, on garde le fond sombre et le texte clair */
  -webkit-text-fill-color:var(--bone) !important;caret-color:var(--bone) !important;
  -webkit-box-shadow:0 0 0 1000px var(--surface) inset !important;box-shadow:0 0 0 1000px var(--surface) inset !important;
  border-radius:0 !important;
  transition:background-color 600000s ease-in-out 0s,color 600000s ease-in-out 0s}
.field input:autofill,.field input:autofill:hover,.field input:autofill:focus,.field textarea:autofill{
  -webkit-text-fill-color:var(--bone) !important;caret-color:var(--bone) !important;
  -webkit-box-shadow:0 0 0 1000px var(--surface) inset !important;box-shadow:0 0 0 1000px var(--surface) inset !important;
  border-radius:0 !important}
.field input,.field textarea{background-color:transparent !important;background-image:none !important;-webkit-text-fill-color:var(--bone) !important}
.field input::placeholder,.field textarea::placeholder{-webkit-text-fill-color:rgba(141,148,143,.55) !important}
.field input:-internal-autofill-selected,.field input:-internal-autofill-previewed{
  -webkit-text-fill-color:var(--bone) !important;-webkit-box-shadow:0 0 0 1000px var(--surface) inset !important;box-shadow:0 0 0 1000px var(--surface) inset !important}
.mailto{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
.mailto:focus{outline:0}
::selection{background:rgba(201,153,92,.38);color:var(--bone)}
.field input::placeholder,.field textarea::placeholder{color:rgba(141,148,143,.55)}
.field.err input,.field.err textarea{border-bottom-color:#d4574e}
.field.err label{color:#d4574e}
.hint{font-size:10.5px;letter-spacing:.12em;color:#e0675d;min-height:0;margin:0}
.field input:invalid,.field textarea:invalid{box-shadow:none}
.field.err .hint{min-height:1.2em}

/* ---------- calendrier de la date ---------- */
.dp{position:relative}
.dp input{display:block;width:100%;padding-right:34px}
.cal-btn{position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;background:none;
  color:var(--mute);cursor:pointer;display:grid;place-items:center;padding:0;transition:color .3s ease}
.cal-btn:hover,.dp.open .cal-btn{color:var(--amber-soft)}
.cal-btn:focus-visible{outline:1px solid var(--amber);outline-offset:0}
.cal{position:absolute;left:0;top:calc(100% + 12px);z-index:40;width:min(328px,calc(100vw - 2*var(--gut)));
  padding:18px 16px 14px;background:rgba(11,18,17,.97);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid var(--hair-strong);border-radius:2px;box-shadow:0 28px 70px rgba(0,0,0,.6);
  opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-8px) scale(.985);transform-origin:20% 0;
  transition:opacity .3s ease,transform .45s cubic-bezier(.22,.9,.3,1),visibility 0s linear .45s}
.dp.open .cal{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition-delay:0s}
.cal-head{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;margin-bottom:12px}
.cal-title{-webkit-appearance:none;appearance:none;background:none;border:0;margin:0 auto;padding:8px 10px;cursor:pointer;
  display:inline-flex;align-items:center;gap:9px;font:400 10.5px/1.2 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--bone);
  transition:color .3s ease}
.cal-title::after{content:"";width:5px;height:5px;margin:-3px 0 0 1px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;
  transform:rotate(45deg);opacity:.7;transition:transform .4s cubic-bezier(.22,.9,.3,1)}
.cal-title:hover,.cal-title:focus-visible{color:var(--amber-soft);outline:0}
.cal.pick .cal-title::after{transform:rotate(-135deg);margin-top:3px}
.cal-nav{width:34px;height:34px;display:grid;place-items:center;border:0;background:none;padding:0;color:var(--mute);cursor:pointer;
  transition:color .3s ease,opacity .3s ease}
.cal-nav:hover{color:var(--amber-soft)}
.cal-nav:disabled{opacity:.25;cursor:default;color:var(--mute)}
.cal-body{position:relative;min-height:262px}
.cal-days,.cal-months{transition:opacity .3s ease,transform .45s cubic-bezier(.22,.9,.3,1),visibility 0s linear 0s}
.cal-months{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:56px;gap:6px;align-content:start;
  opacity:0;visibility:hidden;pointer-events:none;transform:scale(.97);transition-property:opacity,transform,visibility;transition-delay:0s,0s,.45s}
.cal.pick .cal-months{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition-delay:0s}
.cal.pick .cal-days{opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.03);transition-delay:0s,0s,.3s}
.cal-m{-webkit-appearance:none;appearance:none;height:56px;border:1px solid var(--hair);border-radius:2px;background:none;color:var(--bone);
  font:300 12.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;padding:0;
  transition:background .25s ease,border-color .25s ease,color .25s ease}
.cal-m:hover{border-color:rgba(224,183,132,.55)}
.cal-m:focus-visible{outline:0;border-color:var(--amber-soft)}
.cal-m.off{opacity:.2;cursor:default;pointer-events:none}
.cal-m.cur{border-color:var(--amber-soft);color:var(--amber-soft)}
.cal-m.sel{background:var(--amber);border-color:var(--amber);color:#0b1110;font-weight:400}
.cal-wd,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-wd span{text-align:center;font-size:9.5px;letter-spacing:.2em;color:var(--mute);padding:6px 0 8px;text-transform:uppercase}
.cal-grid{row-gap:2px;min-height:222px;align-content:start}
.cal-grid.go-n{animation:calN .34s cubic-bezier(.22,.9,.3,1)}
.cal-grid.go-p{animation:calP .34s cubic-bezier(.22,.9,.3,1)}
@keyframes calN{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes calP{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.cal-d{position:relative;height:36px;border:1px solid transparent;border-radius:2px;background:none;color:var(--bone);
  font:300 13.5px/1 var(--sans);cursor:pointer;padding:0;transition:background .25s ease,border-color .25s ease,color .25s ease}
.cal-d:hover{border-color:rgba(224,183,132,.55)}
.cal-d:focus-visible{outline:0;border-color:var(--amber-soft)}
.cal-d.empty{visibility:hidden;pointer-events:none}
.cal-d.past{opacity:.2;cursor:default;pointer-events:none}
.cal-d.today{border-color:var(--hair-strong)}
.cal-d.sel{background:var(--amber);border-color:var(--amber);color:#0b1110;font-weight:400}
@media (max-width:620px){ .cal{width:100%} }
@media (prefers-reduced-motion:reduce){ .cal,.cal-grid,.cal-days,.cal-months{transition:none!important;animation:none!important} }

/* choix du projet */
.choice{display:grid;gap:12px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0;padding:0;border:0}
.opt{position:relative;display:block;height:100%}
.opt input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:flex;flex-direction:column;justify-content:flex-start;height:100%;
  padding:14px 16px;border:1px solid var(--hair-strong);border-radius:2px;
  font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(237,230,218,.72);
  line-height:1.5;transition:color .35s,border-color .35s,background .35s}
.opt span b{display:block;font-weight:400;letter-spacing:.26em;color:var(--bone)}
.opt span i{display:block;font-style:normal;font-size:10px;letter-spacing:.06em;
  text-transform:none;color:var(--mute);margin-top:5px;line-height:1.6}
.opt:hover span{border-color:rgba(201,153,92,.4)}
.opt input:checked + span{border-color:var(--amber-soft);background:rgba(201,153,92,.09);color:var(--bone)}
.opt input:focus-visible + span{outline:1px solid var(--amber);outline-offset:2px}

.actions{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:10px;text-align:center}
.actions .form-note{max-width:40ch;text-align:center}
.actions .cta-btn{min-width:230px;justify-content:center}
.cta-btn span{margin-right:-.28em}
/* confirmation après envoi : cercle et coche qui se dessinent, remerciement */
.done{display:flex;flex-direction:column;align-items:center;text-align:center;padding:clamp(40px,8vh,90px) 0 20px}
[hidden]{display:none!important}
.done-mark{width:68px;height:68px;color:var(--amber-soft);overflow:visible}
.done-mark circle{stroke-dasharray:189;stroke-dashoffset:189;transform:rotate(-90deg);transform-origin:center;
  animation:doneDraw 1.1s cubic-bezier(.65,0,.35,1) .1s forwards}
.done-mark path{stroke-dasharray:40;stroke-dashoffset:40;animation:doneDraw .55s cubic-bezier(.65,0,.35,1) 1s forwards}
@keyframes doneDraw{to{stroke-dashoffset:0}}
.done h2{font-family:var(--brand);font-stretch:125%;font-weight:300;font-size:clamp(24px,2.6vw,32px);
  letter-spacing:.04em;margin:26px 0 0;opacity:0;animation:doneUp .8s ease 1.2s forwards}
.done p{margin:12px 0 0;color:var(--mute);font-size:14.5px;line-height:1.8;opacity:0;animation:doneUp .8s ease 1.35s forwards}
.done-again{-webkit-appearance:none;appearance:none;background:none;border:0;border-bottom:1px solid rgba(201,153,92,.4);
  margin-top:30px;padding:0 0 3px;cursor:pointer;font:inherit;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--amber-soft);opacity:0;animation:doneUp .8s ease 1.5s forwards}
.done-again:hover{border-bottom-color:var(--amber-soft)}
@keyframes doneUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ .done *{animation:none!important;opacity:1!important;stroke-dashoffset:0!important} }
.cta-btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:16px;
  padding:17px 34px;border-radius:2px;cursor:pointer;
  border:1px solid rgba(201,153,92,.45);background:none;color:var(--amber-soft);
  font-family:var(--sans);font-size:11px;letter-spacing:.28em;text-transform:uppercase;
  transition:color .55s cubic-bezier(.2,.7,.3,1),border-color .55s cubic-bezier(.2,.7,.3,1)}
.cta-btn::before{content:"";position:absolute;inset:0;background:var(--amber-soft);
  transform:scaleX(0);transform-origin:left center;transition:transform .65s cubic-bezier(.22,.7,.25,1)}
.cta-btn>*{position:relative;z-index:1}
.cta-btn svg{transition:transform .55s cubic-bezier(.2,.7,.3,1)}
.cta-btn:hover{color:#0a100f;border-color:var(--amber-soft)}
.cta-btn:hover::before{transform:scaleX(1)}
.cta-btn:hover svg{transform:translateX(6px)}
.form-note{margin:0;font-size:11px;letter-spacing:.16em;color:var(--amber-soft);max-width:30ch;line-height:1.6}
.form-note a{color:var(--bone);border-bottom:1px solid rgba(201,153,92,.5)}
.cta-btn:disabled{opacity:.6;cursor:progress}

/* ---------- pied de page ---------- */
.ftr{flex:0 0 auto;padding:clamp(26px,3.4vw,40px) var(--gut)
  calc(clamp(26px,3.4vw,40px) + env(safe-area-inset-bottom,0px));
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:22px 32px;
  border-top:1px solid var(--hair)}
.ftr .mark img{width:124px}
.social{justify-self:center;display:flex;align-items:center;gap:clamp(12px,1.4vw,20px)}
.social a{width:36px;height:36px;flex:0 0 36px;display:grid;place-items:center;
  border:1px solid var(--hair);border-radius:50%;color:var(--mute);
  transition:color .35s,border-color .35s,background .35s}
.social a{-webkit-tap-highlight-color:transparent}
.social a:focus{outline:0}
.social a:focus-visible{outline:0;color:var(--amber-soft);border-color:rgba(201,153,92,.45);background:rgba(201,153,92,.07)}

<script>
(function(){
  /* toujours ouvrir la page en haut */
  if('scrollRestoration' in history) history.scrollRestoration='manual';
  /* exemple de date : toujours la date du jour */
  (function(){
    var f=document.querySelector('[data-today]'); if(!f) return;
    var d=new Date(), z=function(n){return (n<10?'0':'')+n};
    f.placeholder=z(d.getDate())+'.'+z(d.getMonth()+1)+'.'+d.getFullYear();
    f.addEventListener('input', function(){
      var v=f.value.replace(/\D/g,'').slice(0,8), o=v.slice(0,2);
      if(v.length>2) o+='.'+v.slice(2,4);
      if(v.length>4) o+='.'+v.slice(4);
      f.value=o;
      var w=document.getElementById('wrapWhen'); if(w.classList.contains('err')){ w.classList.remove('err'); document.getElementById('errWhen').textContent=''; }
    });
  })();
  /* ---- calendrier de la date : s'ouvre au clic, simple et fluide ---- */
  (function(){
    var dp=document.getElementById('dp'), inp=document.getElementById('f-when'), cal=document.getElementById('cal');
    if(!dp||!inp||!cal) return;
    var grid=document.getElementById('calGrid'), title=document.getElementById('calTitle'), wd=document.getElementById('calWd'),
        months=document.getElementById('calMonths'), prev=document.getElementById('calPrev'), next=document.getElementById('calNext'), btn=document.getElementById('calBtn');
    var z=function(n){ return (n<10?'0':'')+n; };
    var now=new Date(); now.setHours(0,0,0,0);
    var first=new Date(now.getFullYear(), now.getMonth(), 1), last=new Date(now.getFullYear()+5, 11, 1);
    var view=new Date(first), skip=false, mode='days', yr=first.getFullYear();   /* mode : days | months | years */
    /* écrans tactiles : on choisit dans le calendrier, sans clavier qui masque la grille */
    if(window.matchMedia && matchMedia('(hover:none) and (pointer:coarse)').matches) inp.setAttribute('inputmode','none');

    function loc(){ return (window.I18N && I18N.lang==='en') ? 'en-GB' : 'fr-FR'; }
    function parse(v){
      var m=/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/.exec(v||''); if(!m) return null;
      var d=new Date(+m[3], +m[2]-1, +m[1]); return (d.getMonth()===+m[2]-1 && d.getDate()===+m[1]) ? d : null;
    }
    function key(d){ return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }

    function weekdays(){
      var f=new Intl.DateTimeFormat(loc(),{weekday:'narrow'}), h='';
      for(var i=0;i<7;i++) h+='<span>'+f.format(new Date(2024,0,1+i))+'</span>';   /* 1er janv. 2024 = lundi */
      wd.innerHTML=h;
    }
    function renderDays(dir){
      var y=view.getFullYear(), m=view.getMonth(), sel=parse(inp.value);
      var lead=(new Date(y,m,1).getDay()+6)%7, days=new Date(y,m+1,0).getDate(), h='', i;
      for(i=0;i<lead;i++) h+='<span class="cal-d empty"></span>';
      var df=new Intl.DateTimeFormat(loc(),{weekday:'long',day:'numeric',month:'long',year:'numeric'});
      for(i=1;i<=days;i++){
        var d=new Date(y,m,i), c='cal-d';
        if(d<now) c+=' past';
        if(+d===+now) c+=' today';
        if(sel && +sel===+d) c+=' sel';
        h+='<button type="button" class="'+c+'" data-d="'+key(d)+'" aria-label="'+df.format(d)+'"'+(d<now?' disabled tabindex="-1"':'')+(sel&&+sel===+d?' aria-pressed="true"':'')+'>'+i+'</button>';
      }
      grid.className='cal-grid'; grid.innerHTML=h;
      if(dir){ void grid.offsetWidth; grid.classList.add(dir>0?'go-n':'go-p'); }
    }
    function renderMonths(){
      var f=new Intl.DateTimeFormat(loc(),{month:'short'}), h='', sel=parse(inp.value);
      for(var i=0;i<12;i++){
        var d=new Date(yr,i,1), c='cal-m';
        if(d<first || d>last) c+=' off';
        if(+d===+first) c+=' cur';
        if(sel && sel.getFullYear()===yr && sel.getMonth()===i) c+=' sel';
        h+='<button type="button" class="'+c+'" data-m="'+i+'"'+(d<first||d>last?' disabled tabindex="-1"':'')+'>'+f.format(d).replace('.','')+'</button>';
      }
      months.innerHTML=h;
    }
    function renderYears(){
      var h='', sel=parse(inp.value);
      for(var y=first.getFullYear(); y<=last.getFullYear(); y++){
        var c='cal-m'+(y===first.getFullYear()?' cur':'')+(sel && sel.getFullYear()===y?' sel':'');
        h+='<button type="button" class="'+c+'" data-y="'+y+'">'+y+'</button>';
      }
      months.innerHTML=h;
    }
    function head(){
      if(mode==='years'){
        title.textContent=first.getFullYear()+' – '+last.getFullYear();
        prev.disabled=true; next.disabled=true;
      } else if(mode==='months'){
        title.textContent=String(yr);
        prev.disabled = yr<=first.getFullYear(); next.disabled = yr>=last.getFullYear();
      } else {
        title.textContent=new Intl.DateTimeFormat(loc(),{month:'long',year:'numeric'}).format(view);
        prev.disabled = view<=first; next.disabled = view>=last;
      }
    }
    function setMode(m){
      mode=m;
      cal.classList.toggle('pick', m!=='days'); cal.classList.toggle('yrs', m==='years');
      title.setAttribute('aria-expanded', m!=='days' ? 'true':'false');
      months.setAttribute('aria-hidden', m!=='days' ? 'false':'true');
      if(m==='months'){ yr=Math.min(Math.max(yr,first.getFullYear()),last.getFullYear()); renderMonths(); }
      else if(m==='years') renderYears();
      head();
    }
    function render(dir){ renderDays(dir); if(mode==='months') renderMonths(); else if(mode==='years') renderYears(); head(); }
    function open(){
      var s=parse(inp.value);
      view = (s && s>=now) ? new Date(s.getFullYear(), s.getMonth(), 1) : new Date(view<first?first:view);
      weekdays(); mode='days'; cal.classList.remove('pick','yrs'); months.setAttribute('aria-hidden','true'); title.setAttribute('aria-expanded','false');
      render(0);
      dp.classList.add('open'); inp.setAttribute('aria-expanded','true');
      setTimeout(function(){
        var r=cal.getBoundingClientRect();
        if(r.bottom>window.innerHeight-12) window.scrollBy({top:r.bottom-window.innerHeight+24,behavior:'smooth'});
      },60);
    }
    function close(){ dp.classList.remove('open'); inp.setAttribute('aria-expanded','false'); }
    function choose(d){
      inp.value=z(d.getDate())+'.'+z(d.getMonth()+1)+'.'+d.getFullYear();
      var w=document.getElementById('wrapWhen'); w.classList.remove('err'); document.getElementById('errWhen').textContent='';
      close(); skip=true; inp.focus();
    }

    inp.addEventListener('focus', function(){ if(skip){ skip=false; return; } open(); });
    inp.addEventListener('click', function(){ if(!dp.classList.contains('open')) open(); });
    inp.addEventListener('input', function(){
      if(!dp.classList.contains('open')) return;
      var s=parse(inp.value); if(s && s>=now) view=new Date(s.getFullYear(), s.getMonth(), 1);
      if(mode!=='days') setMode('days'); render(0);
    });
    btn.addEventListener('click', function(){ if(dp.classList.contains('open')) close(); else { skip=true; inp.focus(); open(); } });
    /* titre : jours → mois → années → mois */
    title.addEventListener('click', function(){
      if(mode==='days'){ yr=view.getFullYear(); setMode('months'); }
      else if(mode==='months') setMode('years');
      else setMode('months');
    });
    prev.addEventListener('click', function(){
      if(mode==='months'){ if(yr>first.getFullYear()){ yr--; renderMonths(); head(); } return; }
      if(mode==='days' && view>first){ view=new Date(view.getFullYear(), view.getMonth()-1, 1); render(-1); }
    });
    next.addEventListener('click', function(){
      if(mode==='months'){ if(yr<last.getFullYear()){ yr++; renderMonths(); head(); } return; }
      if(mode==='days' && view<last){ view=new Date(view.getFullYear(), view.getMonth()+1, 1); render(1); }
    });
    months.addEventListener('click', function(e){
      var b=e.target.closest('.cal-m'); if(!b || b.disabled) return;
      if(b.hasAttribute('data-y')){ yr=+b.getAttribute('data-y'); setMode('months'); return; }
      view=new Date(yr, +b.getAttribute('data-m'), 1);
      if(view<first) view=new Date(first);
      mode='days'; cal.classList.remove('pick','yrs'); title.setAttribute('aria-expanded','false'); months.setAttribute('aria-hidden','true');
      render(0);
    });
    grid.addEventListener('click', function(e){
      var b=e.target.closest('.cal-d'); if(!b || b.disabled || b.classList.contains('empty')) return;
      var p=b.getAttribute('data-d').split('-'); choose(new Date(+p[0], +p[1]-1, +p[2]));
    });
    document.addEventListener('pointerdown', function(e){ if(!dp.contains(e.target)) close(); });
    dp.addEventListener('keydown', function(e){
      if(e.key==='Escape' && dp.classList.contains('open')){
        e.stopPropagation();
        if(mode==='years'){ setMode('months'); return; }
        if(mode==='months'){ setMode('days'); return; }
        close(); skip=true; inp.focus();
      }
      else if(e.key==='Enter' && e.target===inp && !dp.classList.contains('open')) open();
    });
    dp.addEventListener('focusout', function(e){ if(e.relatedTarget && !dp.contains(e.relatedTarget)) close(); });
    if(window.I18N){ var prevCh=I18N.onchange; I18N.onchange=function(l){ if(prevCh) prevCh(l); weekdays(); if(dp.classList.contains('open')) render(0); }; }
  })();
  function toTop(){
    window.scrollTo(0,0);
    document.documentElement.scrollTop=0; document.body.scrollTop=0;
    try{ if(window.parent && window.parent!==window) window.parent.scrollTo(0,0); }catch(e){}
  }
  toTop();

  /* remplissage automatique (iPhone/Safari) : le navigateur peint un cadre bleu clair sur les champs remplis.
     1) le style CSS le masque ; 2) en plus, quand un champ est rempli sans que l'on ait tapé dessus, on le remplace par un champ
     tout neuf contenant la même valeur : le navigateur n'y a plus d'état « rempli automatiquement », donc plus de cadre. */
  (function(){
    var IDS=['f-name','f-mail','f-where'], known={}, rebuilt={};
    function el(id){ return document.getElementById(id); }
    function filled(e){ try{ return e.matches(':-webkit-autofill'); }catch(x){ return false; } }
    IDS.forEach(function(id){ var e=el(id); known[id]=e ? e.value : ''; rebuilt[id]=0; });
    /* ce que la personne tape elle-même est « connu » ; une valeur apparue autrement vient du remplissage automatique */
    document.addEventListener('input', function(ev){
      var t=ev.target; if(!t || IDS.indexOf(t.id)<0) return;
      if(!ev.inputType || ev.inputType==='insertReplacementText') return;
      known[t.id]=t.value;
    }, true);
    function rebuild(id){
      var e=el(id); if(!e || !e.parentNode) return;
      var v=e.value, a=document.activeElement===e, s=null, se=null;
      try{ s=e.selectionStart; se=e.selectionEnd; }catch(x){}
      var n=e.cloneNode(false); n.removeAttribute('style'); n.value=v;
      e.parentNode.replaceChild(n, e);
      if(window.__nmObserve) window.__nmObserve(n);
      known[id]=v; rebuilt[id]++;
      if(a){ try{ n.focus({preventScroll:true}); if(s!=null) n.setSelectionRange(s,se); }catch(x){} }
    }
    var TOUCH=false; try{ TOUCH=window.matchMedia('(hover:none) and (pointer:coarse)').matches; }catch(x){}
    function check(id){
      var e=el(id); if(!TOUCH || !e || rebuilt[id]>8) return;
      if(filled(e) || (e.value && e.value!==known[id])) rebuild(id);
      else if(!e.value) known[id]='';
    }
    /* Chrome (iPhone/Android) peint parfois les champs remplis avec un style en ligne (fond clair) : on l'efface dès qu'il apparaît */
    function clean(e){
      if(!e || !e.style) return;
      var st=e.getAttribute('style'); if(!st) return;
      ['background','background-color','background-image','box-shadow','outline','border-radius','color','-webkit-text-fill-color'].forEach(function(p){ e.style.removeProperty(p); });
      if(!e.getAttribute('style')) e.removeAttribute('style');
    }
    function cleanAll(){ IDS.concat(['f-msg']).forEach(function(id){ clean(el(id)); }); }
    try{
      var mo=new MutationObserver(function(list){ list.forEach(function(m){ if(m.target && m.attributeName==='style') clean(m.target); }); });
      IDS.concat(['f-msg']).forEach(function(id){ var e=el(id); if(e) mo.observe(e,{attributes:true,attributeFilter:['style']}); });
      window.__nmObserve=function(e){ try{ mo.observe(e,{attributes:true,attributeFilter:['style']}); }catch(x){} };
    }catch(x){}
    function sweep(){ cleanAll(); IDS.forEach(check); }
    ['input','change','focus','blur','animationstart'].forEach(function(evn){
      document.addEventListener(evn, function(ev){
        var t=ev.target; if(!t || IDS.indexOf(t.id)<0) return;
        setTimeout(function(){ check(t.id); },30); setTimeout(function(){ check(t.id); },450);
      }, true);
    });
    window.addEventListener('pageshow', function(){ setTimeout(sweep,150); setTimeout(sweep,900); });
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) setTimeout(sweep,200); });
    var n=0, t=setInterval(function(){ sweep(); if(++n>120) clearInterval(t); }, 500);
  })();
  window.addEventListener('load', toTop);
  window.addEventListener('pageshow', toTop);
  setTimeout(toTop,60); setTimeout(toTop,300);

  var y=document.getElementById('yr'); if(y) y.textContent=new Date().getFullYear();
  var f=document.getElementById('contactForm'); if(!f) return;
  var note=document.getElementById('formNote');
  var val=function(id){ var el=document.getElementById(id); return el ? (el.value||'').trim() : ''; };

  function mark(wrapId, errId, msg){
    var w=document.getElementById(wrapId), e=document.getElementById(errId);
    if(msg){ w.classList.add('err'); e.textContent=msg; }
    else { w.classList.remove('err'); e.textContent=''; }
    return !msg;
  }
  /* le message d'erreur d'un champ disparaît dès qu'on le corrige (écoute sur le formulaire : reste valable si un champ est remplacé) */
  f.addEventListener('input', function(ev){
    var t=ev.target; if(!t || (t.id!=='f-name' && t.id!=='f-mail')) return;
    var w=t.closest('.field'); if(w && w.classList.contains('err')){ w.classList.remove('err'); w.querySelector('.hint').textContent=''; }
  });

  var again=document.getElementById('doneAgain');
  if(again) again.addEventListener('click', function(){
    document.getElementById('formDone').hidden=true; f.hidden=false;
    var pn2=f.closest('.panel'); if(pn2) pn2.classList.remove('is-done');
    document.getElementById('formDone').style.marginTop='';
    var sp=document.querySelector('.split'); if(sp) sp.style.minHeight='';
    var lab=f.previousElementSibling; if(lab) lab.hidden=false;
    document.getElementById('f-name').focus();
  });
  f.addEventListener('submit', function(e){
    e.preventDefault();
    var name=val('f-name'), mail=val('f-mail');
    var okN=mark('wrapName','errName', name ? '' : I18N.tr('errName','Indiquez votre nom.'));
    var okM=mark('wrapMail','errMail', /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail) ? '' : I18N.tr('errMail','Email invalide.'));
    var whenRaw=val('f-when'), okW=true;
    if(whenRaw){
      var m=/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/.exec(whenRaw), msgW='';
      if(!m){ msgW=I18N.tr('errFmt','Format : jj.mm.aaaa'); }
      else {
        var dd=+m[1], mm=+m[2], yy=+m[3], dt=new Date(yy,mm-1,dd), today=new Date(); today.setHours(0,0,0,0);
        if(dt.getFullYear()!==yy || dt.getMonth()!==mm-1 || dt.getDate()!==dd) msgW=I18N.tr('errDate','Date invalide.');
        else if(dt<today) msgW=I18N.tr('errPast','Choisissez une date à partir d’aujourd’hui.');
      }
      okW=mark('wrapWhen','errWhen', msgW);
    } else { mark('wrapWhen','errWhen',''); }
    if(!okN || !okM || !okW){ note.textContent=''; document.getElementById(!okN ? 'f-name' : (!okM ? 'f-mail' : 'f-when')).focus({preventScroll:false}); return; }

    var picks=Array.prototype.map.call(f.querySelectorAll('input[name="type"]:checked'), function(x){ return x.value; });
    var type=picks.length ? picks.join(' + ') : 'Autre demande';
    var when=val('f-when'), where=val('f-where'), msg=val('f-msg');
    var body=['Nom : '+name,'Email : '+mail,'Projet : '+type];
    if(when)  body.push('Date : '+when);
    if(where) body.push('Lieu : '+where);
    if(msg)   body.push('','Message :',msg);
    /* envoi direct dans la boîte hi@nomoremusic.fr, sans ouvrir la messagerie du visiteur */
    if(f.dataset.busy) return;
    var btn=f.querySelector('.cta-btn'), lbl=btn.querySelector('span');
    f.dataset.busy='1'; btn.disabled=true; lbl.textContent=I18N.tr('sending','Envoi…'); note.textContent='';
    var payload={
      _subject:'Nomore — nouvelle demande · '+type,
      _replyto:mail, _template:'table', _captcha:'false', _honey:val('f-hp'),
      Nom:name, Email:mail, Projet:type, Date:when||'—', Lieu:where||'—', Message:msg||'—'
    };
    var done=function(ok){
      delete f.dataset.busy; btn.disabled=false; lbl.textContent=I18N.tr('send','Envoyer');
      if(ok){
        var y0=window.pageYOffset||document.documentElement.scrollTop||0;
        f.reset(); note.textContent='';
        var d=document.getElementById('formDone');
        /* écran large : la colonne photo garde la hauteur du formulaire, le texte reste sous le visage */
        var sp=document.querySelector('.split'); if(sp && window.matchMedia('(min-width:981px)').matches) sp.style.minHeight=sp.offsetHeight+'px';
        f.hidden=true; var lab=f.previousElementSibling; if(lab && lab.classList.contains('label')) lab.hidden=true;
        var pn=f.closest('.panel'); if(pn) pn.classList.add('is-done');
        /* écran large : le « Merci » prend la place exacte du formulaire (même point de départ) ; si on avait déjà fait défiler la page, il apparaît en haut de ce qu'on voit, sans qu'il faille bouger */
        if(window.matchMedia('(min-width:981px)').matches && pn){
          d.style.marginTop='0px';
          var pin=d.parentNode, sy=window.pageYOffset||0, base=pin.getBoundingClientRect().top+sy,
              spR=document.querySelector('.split').getBoundingClientRect(),
              floorY=spR.bottom+sy-parseFloat(getComputedStyle(pn).paddingBottom||0),
              want=Math.max(base, sy+130); want=Math.min(want, floorY-d.offsetHeight);
          d.style.marginTop=Math.max(0,Math.round(want-base))+'px';
        }
        d.hidden=false;
        d.querySelectorAll('*').forEach(function(el){ el.style.animation='none'; void el.offsetWidth; el.style.animation=''; });
        /* la page ne bouge pas : on remet la position de défilement exactement où elle était (instantané, sans animation) */
        try{ window.scrollTo({top:y0,left:0,behavior:'instant'}); }catch(e){ window.scrollTo(0,y0); }
      } else {
        note.innerHTML=I18N.tr('errSend','L’envoi n’a pas abouti. Écrivez-nous directement : ')
          +'<a href="mailto:hi@nomoremusic.fr">hi@nomoremusic.fr</a>';
      }
    };
    /* délai maximum : si le service ne répond pas, le bouton ne reste jamais bloqué sur « Envoi… » */
    var finished=false, ctl=('AbortController' in window) ? new AbortController() : null;
    var fin=function(ok){ if(finished) return; finished=true; clearTimeout(tm); done(ok); };
    var tm=setTimeout(function(){ try{ if(ctl) ctl.abort(); }catch(e){} fin(false); }, 25000);
    /* 1) notre propre service (/api/contact) : le message est enregistré puis envoyé par e-mail */
    function viaApi(){
      return fetch('/api/contact',{
        method:'POST', headers:{'Content-Type':'application/json'}, signal: ctl ? ctl.signal : undefined,
        body:JSON.stringify({name:name,email:mail,type:type,when:when,where:where,message:msg,_honey:val('f-hp'),lang:(window.I18N&&I18N.lang)||'fr'})
      }).then(function(r){
        if(r.status===404||r.status===405) return null;                      /* pas de service ici : on bascule sur l'envoi direct */
        return r.json().then(function(j){ return r.ok && j && j.ok===true; }, function(){ return null; });
      }, function(){ return null; });
    }
    /* 2) envoi direct vers FormSubmit (repli, ex. aperçu sans service) */
    function direct(){
      return fetch('https://formsubmit.co/ajax/hi@nomoremusic.fr',{
        method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'},
        body:JSON.stringify(payload), signal: ctl ? ctl.signal : undefined
      }).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){
        var ok=r.ok && String(j.success)==='true';
        if(!ok){ try{ console.warn('Formulaire : envoi refusé', r.status, j && j.message); }catch(e){} }
        return ok;
      }); }).catch(function(e){ try{ console.warn('Formulaire : envoi impossible', e); }catch(x){} return false; });
    }
    try{
      viaApi().then(function(res){ return res===null ? direct() : res; }).then(fin, function(){ fin(false); });
    }catch(err){ fin(false); }
  });
})();
</script>
<script>
/* alignement optique : le bord de l'encre du « C », du « L », du « H » et du « R » tombe exactement sur le même bord gauche (celui des pastilles et du trait) */
(function(){
  var cx=document.createElement('canvas').getContext('2d');
  function lsb(el){
    var cs=getComputedStyle(el), t=(el.textContent||'').trim().charAt(0);
    if(cs.textTransform==='uppercase') t=t.toUpperCase();
    try{ cx.fontStretch = parseFloat(cs.fontStretch)>=125 ? 'expanded' : 'normal'; }catch(e){}
    cx.font = cs.fontStyle+' '+cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;
    var m=cx.measureText(t);
    return (m && typeof m.actualBoundingBoxLeft==='number') ? -m.actualBoundingBoxLeft : null;
  }
  function align(){
    var els=document.querySelectorAll('.aside > .label, .aside h1 .ln, .aside .mailto, .aside .delay');
    [].forEach.call(els,function(el){ el.style.marginLeft=''; el.style.translate=''; });
    [].forEach.call(els,function(el){ var v=lsb(el); if(v!=null) el.style.translate=(-v)+'px 0'; });
  }
  align();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(align);
  var rz; window.addEventListener('resize',function(){ clearTimeout(rz); rz=setTimeout(align,120); });
  window.addEventListener('load',align);
})();
</script>
<script>
/* réseaux sociaux : après un clic (ou un retour sur la page), l'icône reprend sa couleur normale */
(function(){
  var links=[].slice.call(document.querySelectorAll('.social a'));
  links.forEach(function(a){ a.addEventListener('click', function(){ setTimeout(function(){ try{ a.blur(); }catch(e){} }, 0); }); });
  function reset(){ links.forEach(function(a){ try{ a.blur(); }catch(e){} }); }
  window.addEventListener('pageshow', reset);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) reset(); });
})();
</script>
